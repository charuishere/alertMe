name: issue-alerts
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-alerts
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - run: python alert.py
        env:
          LOOKBACK_MIN: "20"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
