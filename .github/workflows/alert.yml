name: issue-alerts
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email only"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: issue-alerts
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python alert.py
        env:
          TEST_EMAIL: ${{ inputs.test_email }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
