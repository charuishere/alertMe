name: issue-alerts
on:
  schedule:
    - cron: "*/30 * * * *"      # only a backup start; the run below restarts itself
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email only"
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: issue-alerts
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - id: alert
        run: python alert.py
        env:
          LOOP_MINUTES: ${{ inputs.test_email && '0' || '335' }}
          LOOP_SLEEP: "60"
          TEST_EMAIL: ${{ inputs.test_email }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
      - name: Start the next run
        if: always() && steps.alert.outputs.restart == 'true'
        run: gh workflow run alert.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
